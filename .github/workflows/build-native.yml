name: Build native packages

# Собирает "обычные приложения" AutoSync без Docker — по одному нативному
# пакету на платформу (см. PROJECT.md/README.md, раздел про native-режим):
#   - Linux: PyInstaller-бинарник + .deb (packaging/native-deb/)
#   - Windows: PyInstaller .exe + инсталлятор через Inno Setup
#     (packaging/native-windows/) — обязательно нужен настоящий Windows-
#     раннер, PyInstaller не кросс-компилирует.
#
# Два способа получить готовые файлы:
#   - push в main — пересобирает и обновляет pre-release с тегом `latest`
#     (быстрый доступ к самой свежей сборке, без версии);
#   - тег vX.Y.Z — публикует версионный GitHub Release.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system webview dependencies
        # pywebview на Linux использует системный WebKitGTK через PyGObject
        # (gi) — тот НЕ ставится через pip (см. backend/requirements.txt),
        # build-native-linux.sh наследует его из системного Python через
        # --system-site-packages, поэтому раннеру нужны эти apt-пакеты ДО
        # сборки, иначе PyInstaller не найдёт модуль gi (--collect-all gi).
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Build native Linux binary
        run: ./scripts/build-native-linux.sh

      - name: Build native .deb
        run: ./scripts/build-native-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: autosync-linux
          path: |
            dist/native-linux/autosync
            dist/autosync-desktop_*_amd64.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tesseract OCR + Russian language data
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tessDir = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata" -OutFile "$tessDir\tessdata\rus.traineddata"
          echo "TESSERACT_DIR=$tessDir" >> $env:GITHUB_ENV

      - name: Build native Windows exe
        run: pwsh -File scripts\build-native-windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Determine version and repo root for Inno Setup
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          echo "AUTOSYNC_VERSION=$version" >> $env:GITHUB_ENV
          echo "AUTOSYNC_REPO_ROOT=$(Get-Location)" >> $env:GITHUB_ENV

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\native-windows\autosync.iss

      - uses: actions/upload-artifact@v4
        with:
          name: autosync-windows
          path: |
            dist/native-windows/autosync.exe
            dist/native-windows-installer/*.exe
          if-no-files-found: error

  release-latest:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Update "latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          body: Автосборка последнего коммита в main — не версионный релиз, файлы перезаписываются на каждый push.
          prerelease: true
          make_latest: false
          files: |
            autosync-linux/native-linux/autosync
            autosync-linux/autosync-desktop_*_amd64.deb
            autosync-windows/native-windows/autosync.exe
            autosync-windows/native-windows-installer/*.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            autosync-linux/native-linux/autosync
            autosync-linux/autosync-desktop_*_amd64.deb
            autosync-windows/native-windows/autosync.exe
            autosync-windows/native-windows-installer/*.exe
