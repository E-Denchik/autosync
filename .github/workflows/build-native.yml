name: Build native packages

# Собирает "обычные приложения" AutoSync без Docker — по одному нативному
# пакету на платформу (см. PROJECT.md/README.md, раздел про native-режим):
#   - Linux: PyInstaller-бинарник + .deb (packaging/native-deb/)
#   - Windows: PyInstaller .exe + инсталлятор через Inno Setup
#     (packaging/native-windows/) — обязательно нужен настоящий Windows-
#     раннер, PyInstaller не кросс-компилирует.
#
# Два способа получить готовые файлы:
#   - push в main — пересобирает и обновляет pre-release с тегом `latest`
#     (быстрый доступ к самой свежей сборке, без версии);
#   - тег vX.Y.Z — публикует версионный GitHub Release.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

# Гарантирует, что "latest" всегда отражает САМЫЙ последний коммит в main:
# если пуш B приходит, пока ещё собирается пуш A (тот же ref), недособранный
# прогон A отменяется — иначе A мог бы финишировать позже B и переписать
# "latest" более старой сборкой. Тег vX.Y.Z — свой ref, под свой прогон,
# друг друга не отменяют.
concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Гейт перед сборкой: раньше между пушем в main и автообновлением на
  # машине заказчика (update_checker.py подтягивает pre-release "latest")
  # ничего не прогоняло тесты — сборка и публикация бинарников шли вообще
  # без проверки, что код рабочий. build-linux/build-windows ниже явно
  # требуют (needs) оба тестовых джоба — сломанный тест останавливает всё
  # до сборки, а не после.
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run backend test suite
        run: |
          cd backend
          python -m pytest tests/ -q

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend test suite
        run: |
          cd frontend
          npm run test

  build-linux:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system webview dependencies
        # pywebview на Linux использует системный WebKitGTK через PyGObject
        # (gi) — тот НЕ ставится через pip (см. backend/requirements.txt),
        # build-native-linux.sh наследует его из системного Python через
        # --system-site-packages, поэтому раннеру нужны эти apt-пакеты ДО
        # сборки, иначе PyInstaller не найдёт модуль gi (--collect-all gi).
        #
        # ВАЖНО: намеренно НЕ используем actions/setup-python здесь — сборке
        # нужен именно системный /usr/bin/python3 (см. build-native-linux.sh),
        # для которого apt ставит python3-gi. actions/setup-python не только
        # подменяет python3 в PATH своей отдельной сборкой, но и прописывает
        # LD_LIBRARY_PATH на свою /opt/hostedtoolcache/.../lib — из-за этого
        # PyInstaller при линковке подхватывал ЧУЖУЮ libpython (не ту, под
        # которой шёл анализ), бинарник собирался рассинхронизированным и не
        # мог найти gi в рантайме, хотя на этапе анализа модуль находился
        # нормально. Убрали шаг — используем python3.12, который уже есть в
        # образе ubuntu-latest.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Build native Linux binary
        run: ./scripts/build-native-linux.sh

      - name: Build native .deb
        run: ./scripts/build-native-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: autosync-linux
          path: |
            dist/native-linux/autosync
            dist/autosync-desktop_*_amd64.deb
          if-no-files-found: error

  build-windows:
    needs: [test-backend, test-frontend]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tesseract OCR + Russian language data
        shell: pwsh
        # choco/GitHub-скачивание изредка отваливается по сети на раннере —
        # без ретрая такой разовый сбой проваливал бы всю сборку впустую.
        run: |
          $ErrorActionPreference = "Stop"
          for ($i = 1; $i -le 3; $i++) {
            try {
              choco install tesseract -y --no-progress
              # choco — нативный exe: ненулевой код возврата НЕ бросает
              # исключение в PowerShell сам по себе (в отличие от cmdlet'ов
              # вроде Invoke-WebRequest), поэтому try/catch выше молча
              # "проглатывал" реальный сбой (например 503 от community
              # feed) после первой же попытки — цикл ни разу не
              # ретраился. Явная проверка $LASTEXITCODE заставляет такой
              # сбой попасть в catch и реально повториться.
              if ($LASTEXITCODE -ne 0) { throw "choco install tesseract завершился с кодом $LASTEXITCODE" }
              break
            } catch {
              if ($i -eq 3) { throw }
              Write-Warning "choco install tesseract не удался (попытка $i/3): $_"
              Start-Sleep -Seconds (10 * $i)
            }
          }
          $tessDir = "C:\Program Files\Tesseract-OCR"
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata" -OutFile "$tessDir\tessdata\rus.traineddata"
              break
            } catch {
              if ($i -eq 3) { throw }
              Write-Warning "Загрузка rus.traineddata не удалась (попытка $i/3): $_"
              Start-Sleep -Seconds (10 * $i)
            }
          }
          echo "TESSERACT_DIR=$tessDir" >> $env:GITHUB_ENV

      - name: Build native Windows exe
        run: pwsh -File scripts\build-native-windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          for ($i = 1; $i -le 3; $i++) {
            try {
              choco install innosetup -y --no-progress
              # см. аналогичный комментарий в шаге "Install Tesseract OCR" —
              # без явной проверки $LASTEXITCODE ненулевой код возврата
              # choco не попадёт в catch, и цикл не ретраится.
              if ($LASTEXITCODE -ne 0) { throw "choco install innosetup завершился с кодом $LASTEXITCODE" }
              break
            } catch {
              if ($i -eq 3) { throw }
              Write-Warning "choco install innosetup не удался (попытка $i/3): $_"
              Start-Sleep -Seconds (10 * $i)
            }
          }

      - name: Determine version and repo root for Inno Setup
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          echo "AUTOSYNC_VERSION=$version" >> $env:GITHUB_ENV
          echo "AUTOSYNC_REPO_ROOT=$(Get-Location)" >> $env:GITHUB_ENV

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\native-windows\autosync.iss

      - uses: actions/upload-artifact@v4
        with:
          name: autosync-windows
          path: |
            dist/native-windows/autosync.exe
            dist/native-windows-installer/*.exe
          if-no-files-found: error

  release-latest:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # softprops/action-gh-release создаёт git-тег `latest` САМ только один
      # раз, при первом релизе — на всех следующих пушах он лишь заменяет
      # файлы уже существующего релиза, а сам тег (и коммит, на который он
      # указывает) не трогает. Из-за этого backend/app/services/
      # update_checker.py (сравнивает вшитый в сборку commit SHA с тем,
      # куда сейчас указывает тег `latest` через GitHub API) сравнивал бы
      # актуальную сборку со всё тем же самым первым коммитом навсегда —
      # проверка обновлений считала бы, что обновление есть, даже когда
      # приложение уже самой последней версии. Поэтому двигаем тег на
      # текущий коммит явно, перед тем как отдать его action'у.
      - name: Move "latest" tag to this commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - uses: actions/download-artifact@v4

      # update_checker.py сверяет sha256 скачанного файла с этим списком
      # ПЕРЕД установкой — без него скачанный бинарник ставился (и на Linux
      # запускался через pkexec ROOT'ом) без единой проверки, что он не
      # повреждён по дороге и не подменён (см. её собственный докстринг).
      - name: Generate checksums
        run: |
          sha256sum \
            autosync-linux/native-linux/autosync \
            autosync-linux/autosync-desktop_*_amd64.deb \
            autosync-windows/native-windows/autosync.exe \
            autosync-windows/native-windows-installer/*.exe \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Update "latest" pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: Latest build (main)
          body: Автосборка последнего коммита в main — не версионный релиз, файлы перезаписываются на каждый push.
          prerelease: true
          make_latest: false
          files: |
            autosync-linux/native-linux/autosync
            autosync-linux/autosync-desktop_*_amd64.deb
            autosync-windows/native-windows/autosync.exe
            autosync-windows/native-windows-installer/*.exe
            SHA256SUMS.txt

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      # см. тот же шаг в release-latest выше — update_checker.py требует его
      # для проверки целостности перед установкой.
      - name: Generate checksums
        run: |
          sha256sum \
            autosync-linux/native-linux/autosync \
            autosync-linux/autosync-desktop_*_amd64.deb \
            autosync-windows/native-windows/autosync.exe \
            autosync-windows/native-windows-installer/*.exe \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            autosync-linux/native-linux/autosync
            autosync-linux/autosync-desktop_*_amd64.deb
            autosync-windows/native-windows/autosync.exe
            autosync-windows/native-windows-installer/*.exe
            SHA256SUMS.txt
