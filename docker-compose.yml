services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autosync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autosync}
      POSTGRES_DB: ${POSTGRES_DB:-autosync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autosync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    # Модель нужно подтянуть один раз: docker compose exec ollama ollama pull qwen2.5:14b

  llm-service:
    build: ./llm-service
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosync}:${POSTGRES_PASSWORD:-autosync}@postgres:5432/${POSTGRES_DB:-autosync}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LLM_SERVICE_URL: http://llm-service:8000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    command: >
      sh -c "flask db upgrade && gunicorn -b 0.0.0.0:5000 -w 4 wsgi:app"

  celery-worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosync}:${POSTGRES_PASSWORD:-autosync}@postgres:5432/${POSTGRES_DB:-autosync}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LLM_SERVICE_URL: http://llm-service:8000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery worker --loglevel=info

  celery-beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosync}:${POSTGRES_PASSWORD:-autosync}@postgres:5432/${POSTGRES_DB:-autosync}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery beat --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redis-data:
  ollama-data:
  uploads:
